<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello from Docker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#faf7f7;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

/* Decorative Background */

body::before{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    background:#800020;
    border-radius:50%;
    top:-180px;
    right:-150px;
    opacity:.08;
}

body::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#b03052;
    border-radius:50%;
    bottom:-120px;
    left:-120px;
    opacity:.08;
}

/* Card */

.container{
    width:90%;
    max-width:850px;
    background:white;
    border-radius:28px;
    padding:60px;
    text-align:center;
    box-shadow:0 25px 60px rgba(0,0,0,.08);
    position:relative;
    z-index:2;
    overflow:hidden;
}

/* Top Accent */

.container::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:8px;
    background:linear-gradient(90deg,#800020,#a3163a,#d6336c);
}

.icon{
    width:110px;
    height:110px;
    margin:auto;
    background:linear-gradient(135deg,#800020,#b03052);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    color:white;
    box-shadow:0 15px 30px rgba(128,0,32,.25);
    margin-bottom:25px;
}

h1{
    color:#800020;
    font-size:48px;
    margin-bottom:15px;
}

.subtitle{
    color:#555;
    font-size:20px;
    line-height:1.8;
    margin-bottom:35px;
}

.highlight{
    color:#800020;
    font-weight:600;
}

.badges{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:35px;
}

.badge{
    background:#fff3f5;
    color:#800020;
    padding:12px 22px;
    border-radius:50px;
    font-weight:600;
    border:1px solid #f2c8d4;
}

.button{
    display:inline-block;
    text-decoration:none;
    background:#800020;
    color:white;
    padding:15px 35px;
    border-radius:50px;
    font-weight:600;
    transition:.3s;
}

.button:hover{
    background:#a3163a;
    transform:translateY(-4px);
}

.footer{
    margin-top:35px;
    color:#777;
    font-size:15px;
}

.footer strong{
    color:#800020;
}

@media(max-width:700px){

.container{
    padding:40px 25px;
}

h1{
    font-size:36px;
}

.subtitle{
    font-size:18px;
}

.icon{
    width:90px;
    height:90px;
    font-size:40px;
}

}
</style>

</head>
<body>

<div class="container">

<div class="icon">🐳</div>

<h1>Hello, Docker! 👋</h1>

<p class="subtitle">
Welcome to my Docker learning project.
<br>
This website is running inside a <span class="highlight">Docker Container</span> and is deployed successfully.
</p>

<div class="badges">
<div class="badge">🐳 Docker</div>
<div class="badge">🚀 Nginx</div>
<div class="badge">💻 HTML & CSS</div>
<div class="badge">✅ Deployment Test</div>
</div>

<a href="#" class="button">
Container Running Successfully
</a>

<div class="footer">
Made with ❤️ by <strong>Ishika Sharma</strong><br>
Learning Docker • Building the Future
</div>

</div>

</body>
</html>
